<!DOCTYPE html>
<html><head><style>
body { margin:0; background:#0d0d12; font-family:'Helvetica Neue',Arial,sans-serif; }
.hero { width:640px; height:400px; margin:20px auto; background:linear-gradient(135deg,#7c3aed,#ec4899); border-radius:24px; display:flex; flex-direction:column; justify-content:center; align-items:flex-start; padding:48px; box-sizing:border-box; box-shadow:0 20px 60px rgba(124,58,237,0.4);}
.eyebrow { color:#fff; opacity:0.8; font-size:13px; letter-spacing:2px; text-transform:uppercase; margin-bottom:12px;}
.title { color:#fff; font-size:48px; font-weight:800; line-height:1.05; margin-bottom:16px;}
.sub { color:#fff; opacity:0.85; font-size:16px; max-width:400px; margin-bottom:24px;}
.cta { background:#fff; color:#7c3aed; padding:14px 28px; border-radius:12px; font-weight:700; font-size:14px; display:inline-block;}
</style></head>
<body>
<div class="hero">
  <div class="eyebrow">Introducing</div>
  <div class="title">Do more,<br/>faster.</div>
  <div class="sub">The all-in-one platform teams love. Ship bold products with confidence.</div>
  <div class="cta">Get Started</div>
</div>
</body></html>
