name: kiln audit

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/kiln/skills/kiln
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: audit_kit.py (path-check, gate-proof, count-check, dead-load, superseded)
        run: python3 scripts/audit_kit.py

      - name: every *.selftest.py (plant a violation, confirm red, revert, confirm green)
        run: |
          for f in scripts/*.selftest.py; do
            echo "=== $f ==="
            python3 "$f"
          done
